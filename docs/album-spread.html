<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albumspread — nieuw paginaontwerp</title>
<style>
  /* ==================================================================== *
   * A fresh pass at the spread, worked from the reference render only.
   *
   * Every measurement below is a fraction of `--page-w` or `--page-h`, taken
   * off that image, so the whole book scales from one number without any of
   * the proportions drifting. Deliberately NOT percentages: a percentage
   * padding on `.page` would resolve against `.spread`, i.e. against two
   * pages, and every inset would come out double.
   * ==================================================================== */
  :root {
    /* The page. 0.698 is the reference's own trim ratio (662 x 948). */
    --page-w: min(662px, calc((100vw - 150px) / 2));
    --page-h: calc(var(--page-w) / 0.698);

    /* The measure: trim to the first card column, and trim to the printed
       frame line that sits outside it. */
    --pad-x: calc(var(--page-w) * 0.089);
    --frame-x: calc(var(--page-w) * 0.024);

    /* Times rather than Georgia for everything the press set. Georgia's figures
       are old-style — `68 – 72` comes out with the 6 ascending and the 7
       descending — and the reference's numerals are lining and tabular. There
       is no `lnum` in Georgia to ask for instead. */
    --serif: "Times New Roman", Times, Georgia, serif;

    /* Paper and press */
    --paper: #f1ebd7;
    --paper-hi: #fcf8e9;
    --paper-lo: #e4dcc2;
    --press: #6b5f42;        /* the printed rules and the field */
    --rule: rgba(107, 95, 66, 0.34);
    --ink: #26231b;          /* the head */
    --ink-soft: #8c8471;     /* folio and the position rail */

    /* The board and the flag */
    --board: #241207;
    --board-hi: #4a2a14;
    --flag: #4d5730;
    --flag-lo: #333c1c;
    --foil: #ece0b4;
  }

  * { box-sizing: border-box; }

  /* -------------------------------------------------------------------- *
   * The tabletop
   * -------------------------------------------------------------------- */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 34px 20px;
    background-color: #2e1608;
    background-image:
      /* fine figure, then the broad rings */
      repeating-linear-gradient(180deg,
        rgba(0, 0, 0, .11) 0 1px, rgba(255, 190, 130, .018) 1px 2px,
        rgba(0, 0, 0, .045) 2px 5px, transparent 5px 10px),
      repeating-linear-gradient(178.8deg,
        rgba(0, 0, 0, .1) 0 3px, transparent 3px 29px,
        rgba(118, 60, 24, .085) 29px 33px, transparent 33px 68px),
      radial-gradient(ellipse 64% 40% at 50% 2%, rgba(255, 200, 142, .13), transparent 72%),
      radial-gradient(ellipse 108% 92% at 50% 40%, #43200f 0%, #2c1508 58%, #1a0b04 100%);
    background-attachment: fixed;
  }

  /* ==================================================================== *
   * The book
   * ==================================================================== */
  .book {
    position: relative;
    padding: 7px;
    border-radius: 4px 4px 7px 7px;
    background: linear-gradient(148deg, var(--board-hi) 0%, var(--board) 46%, #381b0c 100%);
    box-shadow:
      0 0 0 1px rgba(122, 76, 35, .5),
      0 30px 56px rgba(11, 4, 2, .72),
      0 4px 10px rgba(0, 0, 0, .5);
  }

  /* The pile, seen at both fore-edges: leaves standing a little proud of the
     block, shaded away at head and tail. */
  .book::before, .book::after {
    content: "";
    position: absolute;
    top: 11px; bottom: 11px;
    width: 27px;
    z-index: 0;
    border-radius: 2px;
    background-image:
      linear-gradient(180deg, rgba(24, 10, 3, .6) 0%, rgba(24, 10, 3, .1) 6%,
        transparent 16%, transparent 84%, rgba(24, 10, 3, .1) 94%, rgba(24, 10, 3, .6) 100%),
      repeating-linear-gradient(90deg,
        rgba(98, 82, 48, .32) 0 1px, rgba(250, 245, 228, .52) 1px 3px),
      linear-gradient(90deg, #cec3a2, #efe8d0);
  }
  .book::before { left: -20px; }
  .book::after  { right: -20px; }

  .spread { position: relative; display: flex; }

  /* -------------------------------------------------------------------- *
   * The page
   * -------------------------------------------------------------------- */
  .page {
    position: relative;
    width: var(--page-w);
    height: var(--page-h);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: calc(var(--page-h) * 0.063) var(--pad-x) 0;
    font-family: Tahoma, Verdana, "MS Sans Serif", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse 130% 74% at 50% -2%,
        var(--paper-hi) 0%, var(--paper) 48%, var(--paper-lo) 100%),
      var(--paper);
  }
  .page--left  { border-radius: 3px 0 0 3px; box-shadow: inset -28px 0 36px -24px rgba(38, 22, 4, .5); }
  .page--right { border-radius: 0 3px 3px 0;  box-shadow: inset  28px 0 36px -24px rgba(38, 22, 4, .5); }

  /* The fold: shading, never a line. */
  .gutter {
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 100px;
    transform: translateX(-50%);
    z-index: 6;
    pointer-events: none;
    background: linear-gradient(90deg,
      rgba(44, 26, 6, 0) 0%, rgba(44, 26, 6, .09) 36%, rgba(44, 26, 6, .25) 50%,
      rgba(44, 26, 6, .09) 64%, rgba(44, 26, 6, 0) 100%);
  }

  /* -------------------------------------------------------------------- *
   * The field in the stock
   *
   * Half a pitch per leaf, aligned to the fold: the box and the D at the head,
   * the halfway line and the centre circle at the foot, the circle sitting on
   * the folio rule. It is in the paper, so it goes under everything.
   * -------------------------------------------------------------------- */
  .field {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: .14;
    pointer-events: none;
  }
  .field svg { display: block; width: 100%; height: 100%; }
  .field path, .field circle {
    fill: none;
    stroke: var(--press);
    stroke-width: .36;
    stroke-linecap: round;
  }
  .field .fine { stroke-width: .24; }

  /* -------------------------------------------------------------------- *
   * The printed frame: a rule under the head, a rule at the foot, and the
   * outer stile joining them. Not a box — the fold end stays open, because
   * nothing on a leaf may pretend to continue onto the other one.
   * -------------------------------------------------------------------- */
  .stile {
    position: absolute;
    top: 11.6%;
    bottom: 7.7%;
    width: 1px;
    z-index: 1;
    background: var(--rule);
  }
  .page--left  .stile { left:  2.4%; }
  .page--right .stile { right: 2.4%; }

  /* -------------------------------------------------------------------- *
   * The head. Its rule runs from the stile out to the fold.
   * -------------------------------------------------------------------- */
  .head {
    flex: none;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: baseline;
    gap: .5em;
    font-family: var(--serif);
    font-size: calc(var(--page-w) * 0.0305);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: .12em;
    line-height: 1.15;
    padding-bottom: calc(var(--page-h) * 0.028);
    border-bottom: 1px solid var(--rule);
  }
  /* The flag stands in the left leaf's head margin, so the title begins after
     it. On the right leaf the flag is out at the fore-edge and the title is
     free to start on the measure. */
  .page--left .head {
    margin: 0 calc(0px - var(--pad-x)) 0 calc(var(--frame-x) - var(--pad-x));
    padding-left: calc(var(--page-w) * 0.135 - var(--frame-x));
  }
  .page--right .head {
    margin: 0 calc(var(--frame-x) - var(--pad-x)) 0 calc(0px - var(--pad-x));
    padding-left: var(--pad-x);
  }
  .head__sep { color: #a79c80; font-weight: normal; }
  .head__range { font-variant-numeric: tabular-nums; }

  /* The flag: a pennant bound into the head margin, pointing inboard. */
  .flag {
    position: absolute;
    top: calc(var(--page-h) * 0.045);
    width: calc(var(--page-w) * 0.088);
    height: calc(var(--page-h) * 0.053);
    z-index: 5;
    display: grid;
    place-items: center;
    background: linear-gradient(158deg, var(--flag) 0%, var(--flag-lo) 100%);
    font-family: var(--serif);
    font-size: calc(var(--page-w) * 0.026);
    font-weight: bold;
    letter-spacing: .08em;
    color: var(--foil);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 1px rgba(0, 0, 0, .45);
  }
  /* The tail is a fraction of the flag, so it has to be stated in page terms —
     a percentage padding here would resolve against the whole leaf. */
  .page--left .flag {
    left: 0;
    padding-right: calc(var(--page-w) * 0.023);
    clip-path: polygon(0 0, 74% 0, 100% 50%, 74% 100%, 0 100%);
  }
  .page--right .flag {
    right: 0;
    padding-left: calc(var(--page-w) * 0.023);
    clip-path: polygon(26% 0, 100% 0, 100% 100%, 26% 100%, 0 50%);
  }

  /* -------------------------------------------------------------------- *
   * The slots
   * -------------------------------------------------------------------- */
  .slots {
    flex: none;
    position: relative;
    z-index: 2;
    margin-top: calc(var(--page-h) * 0.080);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: calc(var(--page-w) * 0.0315);
    row-gap: calc(var(--page-h) * 0.036);
  }

  /* The positions, out in the fore-edge margin — a scale rather than a legend:
     two lozenges bracketing the range and three marks on it. Positioned
     against the page, so it does not have to know what a grid row is. */
  .rail {
    position: absolute;
    top: 19.6%;
    height: 59.5%;
    width: calc(var(--page-w) * 0.05);
    z-index: 2;
    font-family: var(--serif);
    font-size: calc(var(--page-w) * 0.0165);
    letter-spacing: .1em;
    color: var(--ink-soft);
    text-align: center;
  }
  .page--left  .rail { left:  calc(var(--page-w) * 0.026); }
  .page--right .rail { right: calc(var(--page-w) * 0.026); }
  .rail span { position: absolute; left: 0; right: 0; transform: translateY(-50%); }
  .rail i {
    position: absolute;
    left: 50%;
    width: .4em; height: .4em;
    margin: -.2em 0 0 -.2em;
    transform: rotate(45deg);
    background: #93863f;
  }
  .rail .r-top  { top: 4.4%; }
  .rail .r-gk   { top: 7.6%; }
  .rail .r-mf   { top: 47.4%; }
  .rail .r-fw   { top: 93.1%; }
  .rail .r-tail { top: 96.1%; }

  /* -------------------------------------------------------------------- *
   * The foot
   * -------------------------------------------------------------------- */
  .folio {
    flex: none;
    position: relative;
    z-index: 2;
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 1.3em;
    font-family: var(--serif);
    font-size: calc(var(--page-w) * 0.019);
    color: var(--ink-soft);
    padding-bottom: calc(var(--page-h) * 0.066);
  }
  .page--left .folio {
    margin-right: calc(0px - var(--pad-x));
    margin-left: calc(var(--frame-x) - var(--pad-x));
  }
  .page--right .folio {
    margin-left: calc(0px - var(--pad-x));
    margin-right: calc(var(--frame-x) - var(--pad-x));
  }
  .folio::before, .folio::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  /* ==================================================================== *
   * The card
   * ==================================================================== */
  .slot { position: relative; aspect-ratio: 63 / 100; }

  .card {
    --display: "Bahnschrift SemiCondensed", Bahnschrift, "DIN Condensed",
      "DIN Alternate", "Franklin Gothic Medium", "Segoe UI", Tahoma, sans-serif;
    position: absolute;
    inset: 0;
    border-radius: 5%;
    overflow: hidden;
    container-type: inline-size;
    color: #17150f;
  }

  /* Stuck down, so this is a contact shadow and nothing more. */
  .card--set {
    box-shadow:
      0 1px 2px rgba(58, 44, 14, .34),
      0 3px 8px -3px rgba(58, 44, 14, .34);
  }

  .card--zilver {
    background-image:
      linear-gradient(163deg, #f5f8fb 0%, #ced6de 33%, #a8b2bd 62%, #e8edf2 100%);
  }
  .card--goud {
    background-image:
      linear-gradient(163deg, #fbe8a0 0%, #e4c25c 30%, #c89a22 64%, #f7e18d 100%);
  }
  /* The rare treatment: the head flooded, the tier's gold kept at the foot. */
  .card--rood {
    background-image:
      linear-gradient(179deg, #d6242d 0%, #b9121c 52%, #cd8d1d 76%, #ebcd60 100%);
  }
  /* A printed placeholder in the stock, not a dark card in a bright album. It
     still has to be a mount you can count from across the room, so the tone is
     a clear step off the paper rather than a whisper against it. */
  .card--leeg {
    background-image:
      linear-gradient(180deg, #bdbbab 0%, #cfcbb6 42%, #e6e0cb 100%);
    color: #a49b83;
  }

  /* The portrait: a wash for the ground with the sitter over it, faded away at
     the foot and into the top-left so the metal comes back round the numeral. */
  .card__portrait {
    position: absolute;
    inset: 0;
    overflow: hidden;
    -webkit-mask-image:
      linear-gradient(to top, transparent 4%, #000 27%),
      linear-gradient(126deg, transparent 5%, #000 25%);
    mask-image:
      linear-gradient(to top, transparent 4%, #000 27%),
      linear-gradient(126deg, transparent 5%, #000 25%);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
  }
  .card__portrait svg { display: block; width: 100%; height: 100%; }

  /* Standing in for the headshot — this study has no avatars on disk, so the
     sitter is drawn and the ground is a wash.
     *
     * The sitter is INLINED per card rather than pulled in with `<use>`: Chrome
     * carries only inherited properties into a use instance's shadow tree, so
     * `.card--leeg .sil` never reaches the paths and every silhouette on the
     * spread comes out the same tone. */
  .ground { fill: url(#g-cool); }
  .card--goud .ground { fill: url(#g-warm); }
  .card--rood .ground { fill: url(#g-red); }
  .card--leeg .ground { fill: none; }

  /* Two tones, because one tone is a blob: the head and the hair carry the
     weight and the body sits a step behind them, which is roughly what a
     headshot does at this size. */
  .s-body { fill: #56534b; opacity: .74; }
  .s-head { fill: #3f3b34; opacity: .86; }
  .card--rood .s-body { fill: #3b1d15; opacity: .66; }
  .card--rood .s-head { fill: #2a120c; opacity: .78; }
  /* Lighter than its own ground, which is the way round the reference has it:
     an empty slot is a shape lifted out of the tone, not printed onto it. */
  .card--leeg .s-body { fill: #dbd4bc; opacity: 1; }
  .card--leeg .s-head { fill: #d5ceb4; opacity: 1; }

  .card__overall {
    position: absolute;
    top: 2.4%; left: 7%;
    z-index: 2;
    font-family: var(--display);
    font-size: 27cqw;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: .005em;
    text-shadow: 0 1px 1px rgba(0, 0, 0, .16);
  }
  .card--goud .card__overall,
  .card--rood .card__overall { text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
  .card--leeg .card__overall { text-shadow: none; }

  .card__name {
    position: absolute;
    left: 9%; right: 9%; bottom: 5.5%;
    z-index: 2;
    padding-top: 3.5%;
    text-align: center;
    font-family: var(--display);
    font-size: 9.2cqw;
    letter-spacing: .03em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-top: 1px solid rgba(0, 0, 0, .3);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .34);
  }
  .card--rood .card__name { color: #1c1107; }
  .card--leeg .card__name {
    border-top-color: rgba(122, 114, 94, .28);
    box-shadow: inset 0 1px 0 rgba(255, 253, 244, .48);
  }

  /* The sheen. One pass, static — a card in an album does not tilt. */
  .card--set::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(116deg, transparent 34%, rgba(255, 255, 255, .11) 46%,
      rgba(255, 255, 255, .03) 52%, transparent 62%);
  }
</style>
</head>
<body>

<!-- The washes and the sitters, defined once for the whole spread. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-cool" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#eceae4"/><stop offset="1" stop-color="#b7bbc0"/>
    </linearGradient>
    <linearGradient id="g-warm" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#f1e8d0"/><stop offset="1" stop-color="#c9b686"/>
    </linearGradient>
    <linearGradient id="g-red" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#e2333c"/><stop offset="1" stop-color="#9d0f18"/>
    </linearGradient>

  </defs>
</svg>

<div class="book">
  <div class="spread">

    <section class="page page--left">
      <div class="field" data-half="left"></div>
      <div class="stile"></div>
      <div class="flag">03</div>
      <div class="rail">
        <i class="r-top"></i>
        <span class="r-gk">GK</span>
        <span class="r-mf">MF</span>
        <span class="r-fw">FW</span>
        <i class="r-tail"></i>
      </div>
      <div class="head">
        <span class="head__title">Collectie</span>
        <span class="head__sep">·</span>
        <span class="head__range">68 – 72</span>
      </div>
      <div class="slots" data-slots="left"></div>
      <div class="folio"><span>5</span></div>
    </section>

    <section class="page page--right">
      <div class="field" data-half="right"></div>
      <div class="stile"></div>
      <div class="flag">03</div>
      <div class="rail">
        <i class="r-top"></i>
        <span class="r-gk">GK</span>
        <span class="r-mf">MF</span>
        <span class="r-fw">FW</span>
        <i class="r-tail"></i>
      </div>
      <div class="head">
        <span class="head__title">Collectie</span>
        <span class="head__sep">·</span>
        <span class="head__range">73 – 81</span>
      </div>
      <div class="slots" data-slots="right"></div>
      <div class="folio"><span>6</span></div>
    </section>

  </div>
  <div class="gutter"></div>
</div>

<script>
/* ====================================================================== *
 * The field
 *
 * Drawn once in spread units — 200 across for both leaves together and 143
 * down, so the fold is x = 100 — and cropped by each leaf's viewBox. The same
 * marks go to both halves and nothing spans the gutter as one element.
 *
 * The outer touchline is left out on purpose: the printed stile already stands
 * exactly there, and two rules a hairline apart read as one bad registration.
 * ====================================================================== */

const FOLD = 100;
const H = 143;
const FOOT = 131.5;             /* the halfway line, which is the folio rule */
const BOX_D = 22, AREA_D = 10, SPOT = 16, D_R = 11;

/* Only the part of the D outside the box is painted. */
const th = Math.atan2(BOX_D - SPOT, Math.sqrt(D_R * D_R - (BOX_D - SPOT) ** 2));
const at = (r, a) => `${(FOLD + r * Math.cos(a)).toFixed(2)} ${(SPOT + r * Math.sin(a)).toFixed(2)}`;

const MARKS = `
  <path class="fine" d="M76 -6V${BOX_D}H124V-6"/>
  <path class="fine" d="M88 -6V${AREA_D}H112V-6"/>
  <circle class="fine" cx="${FOLD}" cy="${SPOT}" r=".7"/>
  <path class="fine" d="M${at(D_R, Math.PI - th)}A${D_R} ${D_R} 0 0 0 ${at(D_R, th)}"/>

  <path d="M2.4 ${FOOT}H197.6"/>
  <circle cx="${FOLD}" cy="${FOOT}" r="13.5"/>
  <circle class="fine" cx="${FOLD}" cy="${FOOT}" r="2.6"/>
`;

document.querySelectorAll('[data-half]').forEach((host) => {
  const left = host.dataset.half === 'left';
  /* Each half is aligned to the fold, so the two meet there rather than each
     centring itself in its own leaf. */
  const vb = left ? `0 0 ${FOLD} ${H}` : `${FOLD} 0 ${FOLD} ${H}`;
  host.innerHTML = `<svg viewBox="${vb}" preserveAspectRatio="none">${MARKS}</svg>`;
});

/* ====================================================================== *
 * The spread's contents, as the reference has them.
 * ====================================================================== */

const PAGES = {
  left: [
    [null, 'Jeroen van Geel', 'm'],
    [null, 'Rianne Melberg',  'f'],
    [69,   'Ewan Deeley',     'm'],
    [71,   'Simon',           'm'],
    [71,   'Bo',              'f'],
    [null, 'Marie Versteeg',  'f'],
  ],
  right: [
    [73,   'Yannick',      'm'],
    [null, 'Tanny',        'f'],
    [78,   'Nick',         'm'],
    [79,   'Daan Verkade', 'm', 'rood'],
    [null, 'Max Smedts',   'm'],
    [81,   'Mathijs',      'm'],
  ],
};

/* 65+ silver, 75+ gold. `rood` is the rare treatment: it is carried on the
   card rather than derived from the rating. */
const tierFor = (o) => (o >= 75 ? 'goud' : o >= 65 ? 'zilver' : 'brons');

/* The sitter, in a box the shape of the card (100 x 159), so nothing has to be
   cropped to make it fit. Body first, hair and head over it. Two cuts of hair,
   which is about as much as a silhouette can usefully say about anybody. */
const BODY = '<path class="s-body" d="M50 70c16.5 0 27.8 11.6 31.2 28.5L88 159H12l6.8-60.5C22.2 81.6 33.5 70 50 70Z"/>';
const SITTER = {
  m: BODY
    + '<path class="s-head" d="M50 26c9.8 0 16.4 7.6 16.4 18.2 0 11.7-7.3 21.8-16.4 21.8s-16.4-10.1-16.4-21.8C33.6 33.6 40.2 26 50 26Z"/>',
  /* The long cut falls to the jaw and no further. Taken down to the shoulders it
     stops being hair and becomes a skirt — the shape widens where a body would,
     and the silhouette reads as a dress rather than a sitter. */
  f: BODY
    + '<path class="s-head" d="M50 25c10.6 0 17.2 7.6 17.2 18.4 0 5.6-.5 10-1.5 13.4 2.2 5.6 3.6 12.2 4 19.8l.3 7.7c-6.3 1.7-13.7 2.5-20 2.5s-13.7-.8-20-2.5l.3-7.7c.4-7.6 1.8-14.2 4-19.8-1-3.4-1.5-7.8-1.5-13.4C32.8 32.6 39.4 25 50 25Z"/>',
};

document.querySelectorAll('[data-slots]').forEach((host) => {
  host.innerHTML = PAGES[host.dataset.slots].map(
    ([overall, name, sitter, rare]) => {
      const empty = overall === null;
      const tier = empty ? 'leeg' : (rare || tierFor(overall));
      return `<div class="slot">
        <div class="card card--${tier}${empty ? '' : ' card--set'}">
          <div class="card__portrait">
            <svg viewBox="0 0 100 159" preserveAspectRatio="none">
              <rect class="ground" x="0" y="0" width="100" height="159"/>
              ${SITTER[sitter]}
            </svg>
          </div>
          <div class="card__overall">${empty ? '??' : overall}</div>
          <div class="card__name">${name}</div>
        </div>
      </div>`;
    }).join('');
});
</script>
</body>
</html>
